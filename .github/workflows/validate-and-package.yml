name: Validate and package

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate extension
        run: python scripts/validate.py

      - name: Package extension
        run: python scripts/package_extension.py

      - name: Verify candidate package identity
        run: |
          test "$(find dist -maxdepth 1 -type f -name 'zhixing-ai-supervisor-v*.zip' | wc -l)" -eq 1
          test -f dist/zhixing-ai-supervisor-v0.2.0-rc.1.zip
          sha256sum dist/zhixing-ai-supervisor-v0.2.0-rc.1.zip

      - name: Upload candidate package
        uses: actions/upload-artifact@v4
        with:
          name: zhixing-ai-supervisor-v0.2.0-rc.1
          path: dist/zhixing-ai-supervisor-v0.2.0-rc.1.zip
          if-no-files-found: error
